[project]
name = "supportagent"
version = "0.1.0"
description = "AmazonHelp Trust-First Support Agent with Outcome-Verified Grounding and Calibrated Escalation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "faiss-cpu>=1.8.0",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0,<2.2.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "sentence-transformers>=3.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
